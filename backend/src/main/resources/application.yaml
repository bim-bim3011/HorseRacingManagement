spring:
  application:
    name: horse racing management




  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MY_EMAIL:dangkhanh1130@gmail.com}
    password: ${APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000





  datasource:
    url: jdbc:mysql://localhost:3306/horse_racing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
# doi ten password theo mysql cua minh
  jpa:
    hibernate:
      ddl-auto: update

#    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  server:
    port: 8080


  data:
    redis:
      host: localhost
      port: 6379


  security:
    user:
      name: user
      password: 123




jwt:
  signerKey: ${SIGNERKEY}
  expiration: 604800000


outbound:
  identity:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
    redirect-uri: http://localhost:5173/authenticate


cloudinary:
  cloud-name: dzz3kbuuj
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


payment:
  vnPay:
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    tmnCode: ${VNPAY_TMN_CODE}
    secretKey: ${VNPAT_SECRET_KEY}
    returnUrl: http://localhost:8080/api/payment/vn-pay-callback
    version: 2.1.0
    command: pay
    orderType: other

  payOS:
    clientId: ${PAYOS_CLIENT_ID}
    apiKey: ${PAYOS_API_KEY}
    checksumKey: ${PAYOS_CHECKSUM_KEY}
    returnUrl: http://localhost:8080/api/payment/payos/return
    cancelUrl: http://localhost:8080/api/payment/payos/return?cancelled=true
