<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-[#041627] mb-6">🏇 Đăng nhập</h1>

    <!-- Hiển thị lỗi nếu có -->
    <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded mb-4" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Tên đăng nhập</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-yellow-400 outline-none"
                   placeholder="Nhập tên đăng nhập">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Mật khẩu</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-yellow-400 outline-none"
                   placeholder="Nhập mật khẩu">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Vai trò</label>
            <select name="role" class="w-full px-4 py-2 border rounded focus:ring-2 focus:ring-yellow-400 outline-none">
                <option value="admin">Admin</option>
                <option value="horse owner">Chủ ngựa</option>
                <option value="jockey">Kỵ sĩ</option>
                <option value="referee">Trọng tài</option>
                <option value="spectator">Khán giả</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-[#041627] text-white py-2 rounded hover:bg-[#1a2b3c] transition font-semibold">
            Đăng nhập
        </button>
        <div class="mt-4 text-center">
            <a href="/register" class="text-blue-600 hover:underline">Chưa có tài khoản? Đăng ký</a>
        </div>
    </form>
</div>
</body>
</html>
