<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Dự đoán kết quả</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
<aside class="w-64 bg-[#041627] text-white p-6 flex flex-col min-h-screen">
    <h1 class="text-2xl font-bold text-yellow-400 mb-8">🏇 Horse Racing</h1>
    <nav class="flex-1">
        <ul class="space-y-2">
            <li><a href="/spectator/dashboard" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">📊 Dashboard</a></li>
            <li><a href="/spectator/predict" class="block py-2.5 px-4 rounded bg-yellow-400 text-[#041627] font-semibold">🔮 Dự đoán</a></li>
            <li><a href="/spectator/ranking" class="block py-2.5 px-4 rounded hover:bg-gray-700 transition">🏆 Xếp hạng</a></li>
            <li><a href="/logout" class="block py-2.5 px-4 rounded text-red-400 hover:bg-red-600/20 transition mt-8">🚪 Đăng xuất</a></li>
        </ul>
    </nav>
</aside>
<main class="flex-1 p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8" th:text="${pageTitle}">Dự đoán kết quả</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div th:each="race : ${upcomingRaces}" class="bg-white rounded-lg shadow p-6">
            <h3 class="font-bold text-xl" th:text="${race.name}">Summer Cup</h3>
            <p class="text-sm text-gray-500" th:text="${race.raceDatetime}">14/07/2026 09:00</p>
            <form th:action="@{/spectator/predict}" method="post" class="mt-4">
                <input type="hidden" name="raceId" th:value="${race.id}">
                <div class="mb-3">
                    <label class="block text-sm font-semibold">Hạng 1</label>
                    <select name="top1" class="w-full px-3 py-2 border rounded">
                        <option th:each="entry : ${race.raceEntries}" th:value="${entry.horse.id}" th:text="${entry.horse.name}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-semibold">Hạng 2</label>
                    <select name="top2" class="w-full px-3 py-2 border rounded">
                        <option th:each="entry : ${race.raceEntries}" th:value="${entry.horse.id}" th:text="${entry.horse.name}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-semibold">Hạng 3</label>
                    <select name="top3" class="w-full px-3 py-2 border rounded">
                        <option th:each="entry : ${race.raceEntries}" th:value="${entry.horse.id}" th:text="${entry.horse.name}"></option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-[#041627] text-white py-2 rounded hover:bg-[#1a2b3c] transition">Gửi dự đoán</button>
            </form>
        </div>
        <div th:if="${upcomingRaces == null or upcomingRaces.isEmpty()}" class="col-span-2 text-center py-8 text-gray-400">
            Không có cuộc đua nào để dự đoán
        </div>
    </div>
</main>
</body>
</html>
